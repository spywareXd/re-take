[project]
name = "re-take"
version = "0.1.0"
description = "Find and group retakes (repeated sentences) in spoken video, with a local service for the SimpleCut editor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shreyan Nayak" }, { name = "Ashwin Raj" }]
keywords = ["video-editing", "retake-detection", "speech", "transcription", "nlp"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "assemblyai>=0.20.0",
    "fastapi>=0.115.0",
    "faster-whisper>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "ipykernel>=7.3.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12<9",
    "pip>=26.2.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.15.0",
    "pytest>=8.0.0",
    "pyzmq>=27.2.0",
    "requests>=2.0.0",
    "sentence-transformers>=6.0.0",
    "setuptools<70",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "torchvision>=0.20.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.30.0",
    "whisperx>=3.4.5",
]

[project.urls]
Repository = "https://github.com/spywareXd/re-take"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]
